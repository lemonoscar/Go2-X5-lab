  pid: {p: 300.0, i: 0.0, d: 8.0}
RR_calf_controller:
  type: robot_joint_controller/RobotJointController
  joint: RR_calf_joint
  pid: {p: 300.0, i: 0.0, d: 8.0}

RL_hip_controller:
  type: robot_joint_controller/RobotJointController
  joint: RL_hip_joint
  pid: {p: 100.0, i: 0.0, d: 5.0}
RL_thigh_controller:
  type: robot_joint_controller/RobotJointController
  joint: RL_thigh_joint
  pid: {p: 300.0, i: 0.0, d: 8.0}
RL_calf_controller:
  type: robot_joint_controller/RobotJointController
  joint: RL_calf_joint
  pid: {p: 300.0, i: 0.0, d: 8.0}

# Arm joints
arm_joint1_controller:
