# ROS1 controller configuration (basic defaults)
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 1000

# Dog joints
FR_hip_controller:
  type: robot_joint_controller/RobotJointController
  joint: FR_hip_joint
  pid: {p: 100.0, i: 0.0, d: 5.0}
FR_thigh_controller:
  type: robot_joint_controller/RobotJointController
  joint: FR_thigh_joint
  pid: {p: 300.0, i: 0.0, d: 8.0}
FR_calf_controller:
  type: robot_joint_controller/RobotJointController
  joint: FR_calf_joint
  pid: {p: 300.0, i: 0.0, d: 8.0}

FL_hip_controller:
  type: robot_joint_controller/RobotJointController
  joint: FL_hip_joint
  pid: {p: 100.0, i: 0.0, d: 5.0}
FL_thigh_controller:
  type: robot_joint_controller/RobotJointController
  joint: FL_thigh_joint
  pid: {p: 300.0, i: 0.0, d: 8.0}
FL_calf_controller:
  type: robot_joint_controller/RobotJointController
  joint: FL_calf_joint
  pid: {p: 300.0, i: 0.0, d: 8.0}

RR_hip_controller:
